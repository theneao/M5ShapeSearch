version: '3.9'

services:
  # FastAPI 应用 (4个进程)
  shape-match-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shape-match-server
    environment:
      - MOCK_PER_TYPE=120
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - shape-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Redis 缓存 (可选)
  redis:
    image: redis:7-alpine
    container_name: shape-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shape-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Nginx 反向代理 + 负载均衡
  nginx:
    image: nginx:latest
    container_name: shape-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - shape-network
    depends_on:
      - shape-match-app
    restart: unless-stopped

  # Watchtower 自动更新镜像 (生产推荐)
  watchtower:
    image: containrrr/watchtower
    container_name: shape-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_SCHEDULE=0 2 * * *
      - WATCHTOWER_CLEANUP=true
    networks:
      - shape-network
    restart: unless-stopped

networks:
  shape-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
